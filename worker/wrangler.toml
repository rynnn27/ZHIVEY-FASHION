name = "zhivey-fashion-api"
main = "src/index.js"
compatibility_date = "2026-10-30"

[vars]
GITHUB_OWNER = "REPLACE_WITH_GITHUB_USERNAME"
GITHUB_REPO = "ZHIVEY-FASHION"
GITHUB_BRANCH = "main"
ALLOWED_ORIGIN = "https://REPLACE_WITH_GITHUB_USERNAME.github.io"
SITE_BASE_PATH = "/ZHIVEY-FASHION"

[[d1_databases]]
binding = "DB"
database_name = "zhivey-fashion-db"
database_id = "REPLACE_WITH_D1_DATABASE_ID"
